[project]
name = "vidtoolz-rnnn"
version = "0.1.0"
description = "Noise reduction using ffmpeg rnnn model"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-rnnn"
Changelog = "https://github.com/sukhbinder/vidtoolz-rnnn/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-rnnn/issues"
CI = "https://github.com/sukhbinder/vidtoolz-rnnn/actions"

[project.entry-points."vidtoolz_plugins"]
rnnn = "vidtoolz_rnnn:rnnn_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
